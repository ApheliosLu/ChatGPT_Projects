<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5bd56">
  <title>鹈鹕的海岸骑行</title>
  <style>
    :root {
      --ink: #26364a;
      --cream: #fff8e7;
      --sun: #f7c85c;
      --coral: #e96c4d;
      --ocean: #52aebe;
      --deep-ocean: #287c98;
      --foam: #d9f1e8;
      --yellow: #f7d47a;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      color: var(--ink);
      background: var(--sun);
      font-family: Georgia, "Songti SC", "Noto Serif CJK SC", serif;
    }

    main {
      display: grid;
      min-height: 100vh;
      place-items: center;
      padding: clamp(1.1rem, 3vw, 2.8rem);
    }

    .poster {
      width: min(1080px, 100%);
      overflow: hidden;
      border: 4px solid var(--ink);
      border-radius: 24px;
      background: var(--cream);
      box-shadow: 10px 11px 0 rgba(38, 54, 74, .24);
    }

    .poster-header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 1rem;
      padding: clamp(1.2rem, 3vw, 2.25rem) clamp(1.25rem, 4vw, 3.5rem) 1.1rem;
    }

    .eyebrow, .status {
      margin: 0;
      font-family: "Trebuchet MS", sans-serif;
      font-size: .68rem;
      font-weight: 800;
      letter-spacing: .17em;
      text-transform: uppercase;
    }

    .eyebrow { color: var(--coral); }
    .status { color: var(--deep-ocean); white-space: nowrap; }

    h1 {
      max-width: 13ch;
      margin: .28rem 0 0;
      font-size: clamp(2.25rem, 7vw, 5.7rem);
      line-height: .87;
      letter-spacing: -.075em;
    }

    .scene-wrap { border-top: 4px solid var(--ink); }
    svg { display: block; width: 100%; height: auto; }

    .credit {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      margin: 0;
      padding: .75rem clamp(1.25rem, 4vw, 3.5rem) .9rem;
      border-top: 4px solid var(--ink);
      background: var(--cream);
      font-size: clamp(.75rem, 1.4vw, .98rem);
      font-style: italic;
    }

    .credit span:last-child { color: var(--coral); font-style: normal; font-weight: bold; }

    .cloud, .wave, .rider, .wing, .wheel, .pedal-arm, .road-dashes {
      transform-box: view-box;
      transform-origin: center;
    }

    .cloud { animation: cloud-drift 9s ease-in-out infinite alternate; }
    .cloud--two { animation-delay: -4.2s; animation-duration: 11s; }
    .wave { animation: wave-sway 2.6s ease-in-out infinite alternate; }
    .wave--two { animation-delay: -1.2s; }
    .road-dashes { animation: road-scroll .75s linear infinite; }

    .rider {
      transform-origin: 505px 280px;
      animation: rider-bounce .52s cubic-bezier(.34, .02, .55, 1) infinite;
    }

    .wing {
      transform-origin: 520px 255px;
      animation: wing-flap .52s ease-in-out infinite;
    }

    .wing-tip {
      transform-origin: 546px 285px;
      animation: wing-tip .52s ease-in-out infinite;
    }

    .wheel--rear { transform-origin: 405px 394px; animation: wheel-spin .52s linear infinite; }
    .wheel--front { transform-origin: 665px 394px; animation: wheel-spin .52s linear infinite; }
    .pedal-arm { transform-origin: 500px 394px; animation: wheel-spin .52s linear infinite; }
    .leg--front { transform-origin: 500px 290px; animation: leg-pump .52s ease-in-out infinite; }
    .leg--back { transform-origin: 490px 292px; animation: leg-pump .52s ease-in-out infinite reverse; }

    @keyframes wheel-spin { to { transform: rotate(360deg); } }
    @keyframes road-scroll { to { transform: translateX(-68px); } }
    @keyframes cloud-drift { to { transform: translateX(38px); } }
    @keyframes wave-sway { to { transform: translateX(-14px) translateY(3px); } }
    @keyframes rider-bounce {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      48% { transform: translateY(-11px) rotate(-1.5deg); }
      72% { transform: translateY(2px) rotate(.8deg); }
    }
    @keyframes wing-flap {
      0%, 100% { transform: rotate(7deg) translateY(0); }
      50% { transform: rotate(-17deg) translateY(-5px); }
    }
    @keyframes wing-tip {
      0%, 100% { transform: rotate(5deg); }
      50% { transform: rotate(-13deg); }
    }
    @keyframes leg-pump {
      0%, 100% { transform: rotate(12deg); }
      50% { transform: rotate(-17deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; }
    }

    @media (max-width: 560px) {
      .poster-header { align-items: start; flex-direction: column; }
      .credit { align-items: start; flex-direction: column; }
    }
  </style>
</head>
<body>

      </div>

      <p class="credit"><span>海风、盐粒与两轮的自由。</span><span>LOOPING ALL DAY</span></p>
    </article>
  </main>
</body>
</html>
